<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact</title>
    <meta name="author" content="James Simmons">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-splash.png" alt="WWR Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main class="hero">
        <p></p>
        <p></p>
        <p></p>
        <h1>White Water Rafting Company</h1>
        <section>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d53629.17878397538!2d-109.74330880000001!3d32.84992!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1765060911797!5m2!1sen!2sus"
                width="300" height="400" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form>
                <label for="fullname">Name:</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Placeholder">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required placeholder="Placeholder">

                <label for="purpose">Message Purpose</label>
                <div>
                    <label><input type="radio" name="purpose" id="purpose">General Inquiry</label>
                    <label><input type="radio" name="purpose" id="purpose">Reservation Question</label>
                    <label><input type="radio" name="purpose" id="purpose">Website Suggestion</label>
                </div>
                <label for="feedback">Message</label>
                <p></p>
                <textarea name="feedback" id="feedback" rows="4" placeholder="Type here"></textarea>
                <label for="newsletter" class="newsletter"><input type="checkbox" name="newsletter"
                        id="newsletter">Please
                    Subscribe me to
                    the monthly newsletter</label>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
    </main>
    <footer>
        <p>©️2025 | White Water Rafting | James Simmons</p>
        <nav class="socialmedia">
            <a href="https://x.com">
                <img src="images/twitter.png" alt="X">
            </a>
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="FaceBook">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn">
            </a>
        </nav>
    </footer>
</body>
